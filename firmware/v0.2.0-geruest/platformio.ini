; CRSF-Router v0.2.0 - ESP32-S3
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Debug ueber USB, alle 3 HW-UARTs bleiben frei
    -DFW_VERSION_MAJOR=0
    -DFW_VERSION_MINOR=2
    -DFW_VERSION_PATCH=0
